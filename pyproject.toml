[project]
name = "rixo-code-reviewer"
version = "0.1.0"
description = ""
authors = [
    {name = "Rastislav Budinsky",email = "rastislav.budinsky@example.com"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.118.0,<0.119.0)",
    "uvicorn (>=0.37.0,<0.38.0)",
    "pydantic (>=2.11.9,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "typing-extensions (>=4.12.0,<5.0.0)",
    "requests (>=2.32.0,<3.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "claude-agent-sdk (>=0.1.0,<1.0.0)",
    "claude-code-sdk (>=0.0.25,<1.0.0)",
    "numpy (>=1.26.0,<3.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
pytest-mock = "^3.15.1"

