[loggers]
keys=root,uvicorn.error,uvicorn.access

[handlers]
keys=console

[formatters]
keys=default

[logger_root]
level=INFO
handlers=console

[logger_uvicorn.error]
level=WARNING
handlers=console
propagate=0
qualname=uvicorn.error

[logger_uvicorn.access]
level=WARNING
handlers=console
propagate=0
qualname=uvicorn.access

[handler_console]
class=StreamHandler
formatter=default
args=(sys.stdout,)

[formatter_default]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
